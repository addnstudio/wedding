<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電子喜帖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Italiana&family=Noto+Serif+TC:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap">
<style>
/* Layout: a single phone-width invitation column. Envelope opens first, then one scroll: names, message, countdown, schedule, venue, RSVP. Deep forest green and sage with champagne gold lines and a wine-red wax seal. Single look by design. */
:root{
  --green:#1f3a34;
  --green2:#2c5047;
  --sage:#e3ece5;
  --paper:#f7f9f5;
  --gold:#c4a468;
  --gold-ink:#8a6a2f;
  --wine:#7a2a35;
  --blush:#ecc6c0;
  --ink:#22322d;
  --navy:#24466b;
  --soft:#5b6f67;
  --serif:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --cap:'Italiana','Noto Serif TC',serif;
  --script:'Playfair Display',Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--green);
  background-image:linear-gradient(135deg,rgba(196,164,104,.10) 25%,transparent 25% 50%,rgba(196,164,104,.10) 50% 75%,transparent 75%);
  background-size:28px 28px;
  color:var(--ink);
  font-family:var(--serif);
  font-weight:400;
  font-size:16px;
  line-height:1.9;
  padding-left:max(0px,env(safe-area-inset-left,0px));
  padding-right:max(0px,env(safe-area-inset-right,0px));
}
body.lock{overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ---------- envelope intro ---------- */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--green);background-image:radial-gradient(circle at 50% 40%,var(--green2),var(--green) 70%);
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:opacity .9s ease,transform .9s ease}
#intro.gone{opacity:0;transform:scale(1.25);pointer-events:none}
.intro-in{display:flex;flex-direction:column;align-items:center;gap:34px;width:100%}
.intro-cap{font-family:var(--cap);font-weight:700;letter-spacing:.42em;color:var(--gold);font-size:14px;text-align:center;margin:0;padding-left:.42em}
.env{position:relative;width:min(88vw,400px);aspect-ratio:3/2;margin-top:70px}
.env .back{position:absolute;inset:0;background:#cfdcd2;border-radius:4px}
.letter{position:absolute;left:6%;right:6%;top:6%;bottom:6%;background:var(--paper);border:1px solid var(--gold);z-index:1;display:grid;place-items:center;text-align:center;transition:transform 1s cubic-bezier(.3,.9,.3,1) .5s;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.letter span{font-family:var(--script);font-size:32px;color:var(--gold-ink);line-height:1.1}
.front{position:absolute;inset:0;z-index:2;background:#e9f0ea;clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);border-radius:4px}
.front::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(31,58,52,.10))}
.flap{position:absolute;left:0;right:0;top:0;height:64%;z-index:3;background:#dbe6dd;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .8s ease,z-index 0s linear .4s;border-radius:4px 4px 0 0}
.seal{position:absolute;left:50%;top:56%;width:68px;height:68px;margin:-34px 0 0 -34px;z-index:4;border:0;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#a63a48,var(--wine) 60%,#561a24);box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 0 0 4px rgba(255,255,255,.08);
  color:#f3dfb0;font-family:var(--script);font-size:26px;line-height:1;display:grid;place-items:center;transition:opacity .3s,transform .3s;animation:pulse 2.2s ease-in-out infinite}
.seal:hover{transform:scale(1.07)}
@keyframes pulse{50%{box-shadow:0 4px 10px rgba(0,0,0,.35),0 0 0 12px rgba(196,164,104,.18)}}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env.open .letter{transform:translateY(-62%)}
.env.open .seal{opacity:0;pointer-events:none;animation:none}
.hint{font-size:14px;letter-spacing:.3em;color:#cfdcd2;margin:0;padding-left:.3em;transition:opacity .4s}
.env.open~.hint{opacity:0}

/* ---------- main sheet ---------- */
.sheet{max-width:560px;margin:0 auto;background:var(--paper);min-height:100vh;box-shadow:0 0 60px rgba(0,0,0,.35);overflow:hidden}
.pad{padding-block:64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));text-align:center}
.cap{font-family:var(--cap);font-weight:700;letter-spacing:.38em;font-size:13px;line-height:1.6;color:var(--gold-ink);margin:0 0 14px;padding-left:.38em;text-transform:uppercase}
h2{font-weight:600;font-size:26px;letter-spacing:.3em;margin:0 0 26px;padding-left:.3em;line-height:1.4}
p{margin:0 0 14px}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 28px;color:var(--gold);max-width:220px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:var(--gold)}
.orn i{width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}

.hero{position:relative;background:linear-gradient(180deg,var(--sage),var(--paper));padding-top:72px;padding-bottom:80px;overflow:hidden}
.hero .script{font-family:var(--script);font-size:46px;color:var(--gold-ink);line-height:1.2;margin:0 0 6px}
.names{display:flex;flex-direction:column;align-items:center;margin:4px 0 26px;gap:12px}
.names .en{font-family:var(--script);font-size:clamp(20px,5.5vw,24px);letter-spacing:.22em;line-height:1.4;color:var(--gold);margin:0;padding-left:.22em}
.names .zh{display:flex;align-items:center;font-family:var(--serif);font-weight:700;font-size:clamp(44px,13vw,58px);line-height:1.2;letter-spacing:.12em;color:var(--navy);margin:0;padding-left:.12em}
.dia{display:inline-block;width:9px;height:9px;background:var(--gold);transform:rotate(45deg);vertical-align:middle;margin:0 14px;flex:none}
.en .dia{margin:0 9px}
.dateline{font-family:var(--cap);font-weight:700;font-size:30px;letter-spacing:.14em;color:var(--green);padding-left:.14em;margin:0}
.where{font-size:15px;letter-spacing:.25em;color:var(--soft);padding-left:.25em;margin:6px 0 0}
.sprig{display:block;margin:0 auto;width:150px;height:auto;color:var(--gold)}
.petals{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-30px;width:12px;height:16px;background:var(--blush);border-radius:80% 0 80% 0;opacity:.8;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,-30px,0) rotate(0)}50%{transform:translate3d(30px,320px,0) rotate(200deg)}100%{transform:translate3d(-20px,680px,0) rotate(420deg)}}

.invite p:not(.cap){font-size:17px;letter-spacing:.12em;line-height:1.8}
.sign{margin-top:26px;font-size:15px;color:var(--soft);letter-spacing:.2em}

.count{background:var(--green);color:var(--paper)}
.count .cap{color:var(--gold)}
.count h2{color:var(--paper)}
.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:380px;margin:0 auto}
.cd div{border:1px solid rgba(196,164,104,.6);padding:14px 2px 10px}
.cd b{display:block;font-family:var(--cap);font-weight:700;font-size:clamp(30px,10vw,44px);line-height:1.1;color:var(--paper);font-variant-numeric:tabular-nums}
.cd small{display:block;font-size:12px;letter-spacing:.2em;color:var(--gold);padding-left:.2em}
.cdnote{margin:18px 0 0;font-size:15px;letter-spacing:.15em;color:#cfdcd2}

.tl{list-style:none;margin:0 auto;padding:0;width:max-content;max-width:100%;text-align:left}
.tl li{display:grid;grid-template-columns:76px 18px auto;gap:0 12px;position:relative;padding-bottom:26px}
.tl li:last-child{padding-bottom:0}
.tl .t{font-family:var(--cap);font-weight:700;font-size:24px;letter-spacing:.05em;color:var(--gold-ink);text-align:left;line-height:1.5;font-variant-numeric:tabular-nums}
.tl .dot{position:relative}
.tl .dot::before{content:"";position:absolute;left:50%;top:13px;width:9px;height:9px;margin-left:-4.5px;border:1px solid var(--gold-ink);background:var(--paper);transform:rotate(45deg);z-index:1}
.tl .dot::after{content:"";position:absolute;left:50%;top:22px;bottom:-35px;width:1px;background:var(--gold)}
.tl li:last-child .dot::after{display:none}
.tl h3{margin:0;font-size:18px;font-weight:600;letter-spacing:.15em;line-height:1.7}
.tl p{margin:0;font-size:14px;color:var(--soft);letter-spacing:.06em;line-height:1.7}

.venue{background:var(--sage)}
.vname{font-size:22px;font-weight:600;letter-spacing:.2em;margin:0 0 4px;padding-left:.2em}
.addr{font-size:15px;color:var(--soft);letter-spacing:.1em;margin:0 0 20px}
.btn{display:inline-block;border:1px solid var(--green);background:transparent;color:var(--green);padding:10px 30px;letter-spacing:.3em;padding-left:calc(30px + .3em);font-size:15px;cursor:pointer;text-decoration:none;transition:background .2s,color .2s}
.btn:hover{background:var(--green);color:var(--paper)}
.btn.solid{background:var(--green);color:var(--paper)}
.btn.solid:hover{background:var(--wine);border-color:var(--wine)}
.tips{list-style:none;margin:28px auto 0;padding:0;width:max-content;max-width:100%;text-align:left;font-size:14px;color:var(--soft);line-height:1.8}
.tips li{padding:8px 0;border-top:1px solid rgba(196,164,104,.55);display:grid;grid-template-columns:64px auto;gap:8px}
.tips b{color:var(--gold-ink);font-weight:600;letter-spacing:.1em}

form{max-width:380px;margin:0 auto;text-align:left;display:flex;flex-direction:column;gap:18px}
label,.lab{font-size:14px;letter-spacing:.15em;color:var(--gold-ink);display:block;margin-bottom:4px}
input[type=text],select,textarea{width:100%;background:#fff;border:1px solid #b9c7bd;border-radius:0;padding:10px 12px;line-height:1.6}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{margin:0;text-align:center;border:1px solid var(--green);padding:10px 4px;color:var(--green);cursor:pointer;letter-spacing:.2em;font-size:15px;transition:background .2s,color .2s}
.seg input:checked+label{background:var(--green);color:var(--paper)}
.seg input:focus-visible+label{outline:3px solid var(--gold);outline-offset:3px}
.seg{position:relative}
.stepper{display:flex;align-items:center;gap:0;width:fit-content}
.stepper button{width:44px;height:44px;border:1px solid var(--green);background:#fff;color:var(--green);font-size:22px;cursor:pointer;line-height:1}
.stepper output{display:block;min-width:60px;text-align:center;font-family:var(--cap);font-weight:700;font-size:26px;border-block:1px solid var(--green);height:44px;line-height:42px}
.result{max-width:380px;margin:26px auto 0;text-align:left}
.result pre{margin:0 0 14px;background:#fff;border:1px dashed var(--gold-ink);padding:14px 16px;white-space:pre-wrap;font-family:var(--serif);font-size:15px;line-height:1.9}
.result .note{font-size:13px;color:var(--soft);letter-spacing:.05em;margin-top:10px}

.foot{background:var(--green);color:var(--paper);padding-block:60px 90px}
.foot .script{font-family:var(--script);font-size:48px;color:var(--gold);line-height:1.2;margin:0 0 6px}
.foot p{letter-spacing:.2em;font-size:15px}


.arch{width:min(76%,300px);aspect-ratio:3/4;margin:26px auto 30px;border:1px solid var(--gold);border-radius:999px 999px 0 0;padding:8px;background:var(--paper);box-shadow:0 10px 30px rgba(31,58,52,.18)}
.arch img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%;border-radius:999px 999px 0 0}
.gal{background:var(--paper)}
.car{display:flex;flex-direction:column;align-items:center;gap:18px}
.main-btn{display:flex;align-items:center;justify-content:center;width:min(100%,320px);height:min(440px,60vh);padding:8px;margin:0 auto;border:1px solid var(--gold);background:#fff;cursor:zoom-in;box-shadow:0 8px 22px rgba(31,58,52,.14)}
.main-btn img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transition:opacity .35s}
.main-btn img.fade{opacity:.2}
.thumbs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.thumb{width:56px;height:56px;padding:2px;margin:0;border:1px solid var(--gold);background:#fff;cursor:pointer;opacity:.55;transition:opacity .2s,box-shadow .2s}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb.on{opacity:1;box-shadow:0 0 0 2px var(--gold-ink)}
.ctrl{display:flex;align-items:center;justify-content:center;gap:18px}
.nav{width:40px;height:40px;border-radius:50%;border:1px solid var(--green);background:transparent;color:var(--green);font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.nav:hover{background:var(--green);color:var(--paper)}
.gal-cnt{font-family:var(--cap);font-weight:700;font-size:14px;letter-spacing:.2em;color:var(--gold-ink);min-width:64px;text-align:center}
.hint2{font-size:13px;letter-spacing:.2em;color:var(--soft);margin:0}
.ring-gold{display:inline-block;width:.6em;height:.33em;vertical-align:middle;color:var(--gold);margin:0 .1em}
.foot .script{letter-spacing:.12em}
.en-line{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:19px;letter-spacing:.03em;line-height:1.6;color:var(--ink);margin:0 0 8px}
.lb{position:fixed;inset:0;z-index:180;display:grid;place-items:center;background:rgba(18,32,28,.94);padding:56px 60px;padding-left:max(60px,env(safe-area-inset-left,0px));padding-right:max(60px,env(safe-area-inset-right,0px))}
.lb[hidden]{display:none}
.lb img{display:block;max-width:100%;max-height:72vh;object-fit:contain;border:6px solid #fff;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:44px;height:44px;border:1px solid var(--gold);border-radius:50%;background:transparent;color:var(--paper);font-size:24px;line-height:1;cursor:pointer;padding:0}
.lb .ln{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:1px solid var(--gold);border-radius:50%;background:rgba(18,32,28,.5);color:var(--paper);font-size:24px;line-height:1;cursor:pointer;padding:0}
.lb .pv{left:max(10px,env(safe-area-inset-left,0px))}
.lb .nx{right:max(10px,env(safe-area-inset-right,0px))}
.lb .cnt{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:var(--gold);letter-spacing:.3em;font-family:var(--cap);font-weight:700;font-size:14px}
.rsvp .rsvp-note{font-size:15px;letter-spacing:.1em;color:var(--soft);margin:0 0 28px}
.btn.big{padding:14px 40px;font-size:17px;padding-left:calc(40px + .3em)}


.mus{position:fixed;z-index:150;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--gold);border-radius:999px;background:rgba(31,58,52,.88);color:var(--gold);font-size:13px;letter-spacing:.15em;cursor:pointer;backdrop-filter:blur(4px)}
.mus[hidden]{display:none}
.mus .ic{font-size:18px;line-height:1}
.mus.on .ic{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(8deg)}}

.rv{animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards}
.rv.d1{animation-delay:.15s}.rv.d2{animation-delay:.35s}.rv.d3{animation-delay:.55s}.rv.d4{animation-delay:.75s}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
.tag{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:200;background:rgba(31,58,52,.92);color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:2px 16px;font-size:12px;letter-spacing:.2em;pointer-events:none;white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .petal{display:none}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="sprig" viewBox="0 0 160 50">
    <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M6 28 Q50 8 80 26 Q112 44 154 22"/></g>

      <ellipse cx="30" cy="19" rx="9" ry="3.6" transform="rotate(-24 30 19)"/>

      <ellipse cx="80" cy="26" rx="4" ry="4"/>
      <ellipse cx="108" cy="36" rx="9" ry="3.6" transform="rotate(30 108 36)"/>
      <ellipse cx="124" cy="33" rx="9" ry="3.6" transform="rotate(-16 124 33)"/>
      <ellipse cx="136" cy="24" rx="9" ry="3.6" transform="rotate(-30 136 24)"/>
      <ellipse cx="98" cy="25" rx="9" ry="3.6" transform="rotate(-34 98 25)"/>
    </g>
  </symbol>
</svg>

<div class="tag" id="demo-tag">範例版 · 姓名與資訊待替換</div>
<button class="mus" id="mus" type="button" aria-pressed="false" hidden><span class="ic" aria-hidden="true">♪</span><span id="mus-t">音樂</span></button>
<audio id="bgm" loop preload="auto"></audio>

<div id="intro">
  <div class="intro-in">
    <p class="intro-cap">WEDDING INVITATION</p>
    <div class="env" id="env">
      <div class="back"></div>
      <div class="letter"><span id="name-letter"></span></div>
      <div class="front"></div>
      <div class="flap"></div>
      <button class="seal" id="seal" type="button" aria-label="拆開喜帖">J&amp;Y</button>
    </div>
    <p class="hint">輕觸封蠟,拆開喜帖</p>
  </div>
</div>

<main class="sheet" id="main" hidden>
  <section class="pad hero">
    <div class="petals" id="petals" aria-hidden="true"></div>
    <svg class="sprig rv" viewBox="0 0 160 50" aria-hidden="true"><use href="#sprig"/></svg>
    <p class="cap rv d1" style="margin-top:22px" data-f="heroCap"></p>
    <p class="script rv d1" data-f="heroScript"></p>
    <div class="arch rv d2" id="arch-wrap"><img id="arch-img" alt=""></div>
    <div class="names rv d2">
      <p class="zh"><span data-f="zhGroom"></span><i class="dia"></i><span data-f="zhBride"></span></p>
      <p class="en" id="name-en"></p>
    </div>
    <p class="dateline rv d3" data-f="dateText"></p>
    <p class="where rv d3" data-f="dayTimeText"></p>
    <p class="where rv d4" data-f="venueShort"></p>
  </section>

  <section class="pad invite">
    <p class="cap">Invitation</p>
    <h2>誠摯邀請</h2>
    <div class="orn"><i></i></div>
    <div id="invite-lines"></div>
    <div id="invite-en"></div>
    <div class="sign" data-f="signOff"></div>
  </section>

  <section class="pad gal" id="gal-sec">
    <p class="cap">Our moments</p>
    <h2>我們的日常</h2>
    <div class="orn"><i></i></div>
    <div class="car">
      <button class="main-btn" id="main-btn" type="button" aria-label="放大照片"><img id="main-img" alt=""></button>
      <div class="thumbs" id="thumbs"></div>
      <div class="ctrl">
        <button class="nav" id="prev" type="button" aria-label="上一張">‹</button>
        <span class="gal-cnt" id="gal-cnt"></span>
        <button class="nav" id="next" type="button" aria-label="下一張">›</button>
      </div>
      <p class="hint2">點大圖可以放大</p>
    </div>
  </section>

  <section class="pad count">
    <p class="cap">Countdown</p>
    <h2>距離婚禮</h2>
    <div class="cd" role="timer">
      <div><b id="cd-d">0</b><small>天</small></div>
      <div><b id="cd-h">00</b><small>時</small></div>
      <div><b id="cd-m">00</b><small>分</small></div>
      <div><b id="cd-s">00</b><small>秒</small></div>
    </div>
    <p class="cdnote" id="cd-note"></p>
  </section>

  <section class="pad">
    <p class="cap">Schedule</p>
    <h2>婚禮流程</h2>
    <div class="orn"><i></i></div>
    <ul class="tl" id="schedule"></ul>
  </section>

  <section class="pad venue">
    <p class="cap">Location</p>
    <h2>婚禮地點</h2>
    <div class="orn"><i></i></div>
    <p class="vname" data-f="venueName"></p>
    <p class="addr" data-f="address"></p>
    <a class="btn solid big" id="map" href="#" target="_blank" rel="noopener">開啟地圖</a>
    <ul class="tips" id="tips"></ul>
  </section>

  <section class="pad rsvp">
    <p class="cap">RSVP</p>
    <h2>出席回覆</h2>
    <div class="orn"><i></i></div>
    <p class="rsvp-note" data-f="rsvpNote"></p>
    <a class="btn solid big" id="rsvp" href="#" target="_blank" rel="noopener">填寫出席回覆</a>
  </section>

  <section class="pad foot">
    <svg class="sprig" viewBox="0 0 160 50" aria-hidden="true"><use href="#sprig"/></svg>
    <p class="script" style="margin-top:18px">With love</p>
    <p data-f="footerLine"></p>
    <p style="color:var(--gold);letter-spacing:.3em" data-f="footNames"></p>
  </section>
</main>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="照片放大">
  <button class="x" id="lb-x" type="button" aria-label="關閉">×</button>
  <button class="ln pv" id="lb-p" type="button" aria-label="上一張">‹</button>
  <img id="lb-img" alt="">
  <button class="ln nx" id="lb-n" type="button" aria-label="下一張">›</button>
  <div class="cnt" id="lb-c"></div>
</div>

<script>
(function(){
"use strict";
var C=CONFIG;
function $(i){return document.getElementById(i)}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

/* 1. 把設定區的內容放進頁面 */
document.querySelectorAll("[data-f]").forEach(function(el){var v=C[el.getAttribute("data-f")];el.textContent=v==null?"":v});
var RING='<i class="dia"></i>';
["name-en","name-letter"].forEach(function(id){
  var el=$(id),pr=String(C.nameEn).split("&");
  if(pr.length<2){el.textContent=C.nameEn}else{el.innerHTML=esc(pr[0].trim())+" "+RING+" "+esc(pr[1].trim())}
});
$("demo-tag").hidden=!C.showDemoTag;
if(C.arch){$("arch-img").src=C.arch}else{$("arch-wrap").hidden=true}
$("invite-lines").innerHTML=C.invite.map(function(t){return "<p>"+esc(t)+"</p>"}).join("");
$("invite-en").innerHTML=C.inviteEn.map(function(t){return '<div class="en-line">'+esc(t)+"</div>"}).join("");
$("schedule").innerHTML=C.schedule.map(function(x){return '<li><span class="t">'+esc(x.time)+'</span><span class="dot"></span><div><h3>'+esc(x.title)+'</h3><p>'+esc(x.desc)+'</p></div></li>'}).join("");
$("tips").innerHTML=C.tips.map(function(x){return "<li><b>"+esc(x.label)+"</b><span>"+esc(x.text)+"</span></li>"}).join("");
$("map").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(C.mapSearch);
$("rsvp").href=C.rsvpUrl;
var bgm=$("bgm");
if(C.music){bgm.src=C.music}

/* 2. 信封開場 */
document.body.classList.add("lock");
var opened=false,wantMusic=false,fadeT=null;
var ac=null;
function chime(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ac=ac||new AC();if(ac.state==="suspended")ac.resume();
    [1047,1319,1568,2093].forEach(function(f,i){
      var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.16;
      o.type="sine";o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+1.4);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+1.5);
    });
  }catch(e){}
}
function setMusicUi(on){$("mus").classList.toggle("on",on);$("mus").setAttribute("aria-pressed",on?"true":"false");$("mus-t").textContent=on?"音樂 開":"音樂 關"}
function musicOn(){
  if(!C.music)return;
  wantMusic=true;
  try{
    bgm.volume=0;
    var p=bgm.play();
    var go=function(){setMusicUi(true);clearInterval(fadeT);fadeT=setInterval(function(){if(bgm.volume<.55){bgm.volume=Math.min(.55,bgm.volume+.03)}else clearInterval(fadeT)},120)};
    if(p&&p.then)p.then(go,function(){wantMusic=false;setMusicUi(false)});else go();
  }catch(e){wantMusic=false;setMusicUi(false)}
}
function musicOff(){wantMusic=false;clearInterval(fadeT);try{bgm.pause()}catch(e){}setMusicUi(false)}
$("mus").addEventListener("click",function(){if(wantMusic)musicOff();else musicOn()});
document.addEventListener("visibilitychange",function(){
  if(document.hidden){try{bgm.pause()}catch(e){}}
  else if(wantMusic){try{bgm.play()}catch(e){}}
});
function openCard(){
  if(opened)return;opened=true;
  chime();musicOn();
  $("env").classList.add("open");
  setTimeout(function(){$("intro").classList.add("gone");$("main").hidden=false;if(C.music)$("mus").hidden=false;window.scrollTo(0,0)},1900);
  setTimeout(function(){$("intro").hidden=true;document.body.classList.remove("lock")},2900);
}
$("seal").addEventListener("click",openCard);
$("env").addEventListener("click",openCard);

/* 3. 花瓣 */
(function(){
  var h="";
  for(var i=0;i<14;i++){
    var l=Math.random()*100,d=Math.random()*9,s=7+Math.random()*9,du=9+Math.random()*7;
    h+='<i class="petal" style="left:'+l.toFixed(1)+'%;animation-duration:'+du.toFixed(1)+'s;animation-delay:-'+d.toFixed(1)+'s;width:'+s.toFixed(0)+'px;height:'+(s*1.3).toFixed(0)+'px"></i>';
  }
  $("petals").innerHTML=h;
})();

/* 4. 倒數計時 */
var TARGET=new Date(C.weddingDate);
function pad(n){return n<10?"0"+n:""+n}
function tick(){
  var ms=TARGET-new Date();
  if(ms<=0){$("cd-d").textContent="0";$("cd-h").textContent="00";$("cd-m").textContent="00";$("cd-s").textContent="00";$("cd-note").textContent=C.countdownDone;return}
  var s=Math.floor(ms/1000);
  $("cd-d").textContent=Math.floor(s/86400);
  $("cd-h").textContent=pad(Math.floor(s%86400/3600));
  $("cd-m").textContent=pad(Math.floor(s%3600/60));
  $("cd-s").textContent=pad(s%60);
  $("cd-note").textContent=C.countdownNote;
}
tick();setInterval(tick,1000);

/* 5. 我們的日常:大圖與縮圖 */
if(!C.gallery.length){$("gal-sec").hidden=true}
else{
  var n=C.gallery.length,gi=0,gTimer=null,lbI=0,mainImg=$("main-img"),thumbsEl=$("thumbs");
  C.gallery.forEach(function(src,i){
    var b=document.createElement("button");b.type="button";b.className="thumb";b.setAttribute("aria-label","第 "+(i+1)+" 張");
    b.innerHTML='<img src="'+esc(src)+'" alt="">';
    b.addEventListener("click",function(){show(i);kick()});
    thumbsEl.appendChild(b);
  });
  var thumbs=[].slice.call(thumbsEl.children);
  var show=function(i){
    gi=(i+n)%n;
    mainImg.classList.add("fade");
    setTimeout(function(){mainImg.src=C.gallery[gi];mainImg.alt="我們的日常照片 "+(gi+1);mainImg.classList.remove("fade")},180);
    thumbs.forEach(function(t,k){t.classList.toggle("on",k===gi)});
    $("gal-cnt").textContent=(gi+1)+" / "+n;
  };
  var kick=function(){clearInterval(gTimer);if(n>1)gTimer=setInterval(function(){show(gi+1)},4500)};
  $("prev").addEventListener("click",function(){show(gi-1);kick()});
  $("next").addEventListener("click",function(){show(gi+1);kick()});
  show(0);kick();

  /* 放大檢視 */
  var lb=$("lb"),lbImg=$("lb-img");
  var showLb=function(i){lbI=(i+n)%n;lbImg.src=C.gallery[lbI];lbImg.alt="我們的日常照片 "+(lbI+1);$("lb-c").textContent=(lbI+1)+" / "+n};
  $("main-btn").addEventListener("click",function(){showLb(gi);lb.hidden=false;clearInterval(gTimer);$("lb-x").focus()});
  var closeLb=function(){lb.hidden=true;lbImg.removeAttribute("src");kick()};
  $("lb-x").addEventListener("click",closeLb);
  $("lb-p").addEventListener("click",function(e){e.stopPropagation();showLb(lbI-1)});
  $("lb-n").addEventListener("click",function(e){e.stopPropagation();showLb(lbI+1)});
  lb.addEventListener("click",function(e){if(e.target===lb)closeLb()});
  document.addEventListener("keydown",function(e){if(lb.hidden)return;if(e.key==="Escape")closeLb();else if(e.key==="ArrowLeft")showLb(lbI-1);else if(e.key==="ArrowRight")showLb(lbI+1)});
}
})();
</script>
</body>
</html>
